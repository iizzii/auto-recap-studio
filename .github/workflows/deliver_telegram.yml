name: Deliver Rendered Series to Telegram

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "GitHub Actions Run ID that produced the series artifact"
        required: true
        type: string
      artifact_name:
        description: "Artifact name to deliver (e.g. series-sprite_fright-reels)"
        required: true
        type: string
        default: series-sprite_fright-reels

jobs:
  deliver-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Download rendered series artifact from run
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/tg_delivery

      - name: Send all rendered parts to Telegram in order
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          chat_id = os.environ["TELEGRAM_CHAT_ID"].strip()
          assert token and chat_id, "TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID secrets must be set."

          root = Path("/tmp/tg_delivery")
          mp4s = sorted(root.rglob("part*_final_short.mp4"), key=lambda p: p.name)
          assert mp4s, f"No part*_final_short.mp4 found under {root}"

          qa_files = list(root.rglob("qa_summary.json"))
          qa_by_part = {}
          slug = "series"
          if qa_files:
              summary = json.loads(qa_files[0].read_text(encoding="utf-8"))
              slug = summary.get("slug", slug)
              print("=== QA SUMMARY ===")
              print(json.dumps(summary, indent=2))
              for p in summary.get("parts", []):
                  qa_by_part[int(p["part_number"])] = p

          total = len(mp4s)
          for idx, mp4 in enumerate(mp4s, start=1):
              size_mb = mp4.stat().st_size / (1024 * 1024)
              upload_file = mp4
              if size_mb > 49.0:
                  print(f"{mp4.name} is {size_mb:.1f} MB (>49 MB); transcoding Telegram copy...")
                  upload_file = Path(f"/tmp/tg_part{idx}.mp4")
                  subprocess.run(
                      [
                          "ffmpeg", "-y", "-i", str(mp4),
                          "-c:v", "libx264", "-preset", "fast", "-crf", "24",
                          "-c:a", "aac", "-b:a", "128k", "-movflags", "+faststart",
                          str(upload_file),
                      ],
                      check=True,
                  )
                  size_mb = upload_file.stat().st_size / (1024 * 1024)

              part_info = qa_by_part.get(idx, {})
              m = part_info.get("metrics", {})
              headline = m.get("top_headline", "")
              dur = m.get("video_duration_sec", 0.0)
              share = m.get("commentary_share", 0.0) * 100.0
              freezes = m.get("freeze_count", 0)
              emotions = m.get("distinct_emotions_count", 0)
              lufs = m.get("integrated_lufs", -14.0)

              caption = (
                  f"🎬 {slug.replace('_', ' ').title()} — Part {idx}/{total}\n"
                  f"🔥 {headline}\n\n"
                  f"⏱ {dur:.1f}s | 🎙 {share:.1f}% Kiko | ❄️ {freezes} Freeze Roasts | "
                  f"😺 {emotions} Emotions | 🔊 {lufs:.1f} LUFS\n"
                  f"📦 {size_mb:.1f} MB (1080×1920 30fps)"
              ).strip()

              print(f"Sending Part {idx}/{total}: {upload_file.name} ({size_mb:.1f} MB) -> Telegram...")
              res = subprocess.run(
                  [
                      "curl", "-fsSL", "-X", "POST",
                      f"https://api.telegram.org/bot{token}/sendVideo",
                      "-F", f"chat_id={chat_id}",
                      "-F", f"video=@{upload_file}",
                      "-F", "supports_streaming=true",
                      "-F", "width=1080",
                      "-F", "height=1920",
                      "-F", f"caption={caption[:1024]}",
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              payload = json.loads(res.stdout)
              assert payload.get("ok") is True, f"Telegram sendVideo failed: {payload}"
              msg_id = payload.get("result", {}).get("message_id")
              print(f"SENT Part {idx}/{total} cleanly! Telegram message_id={msg_id}")

          print(f"ALL {total} PARTS DELIVERED TO TELEGRAM!")
          PY
