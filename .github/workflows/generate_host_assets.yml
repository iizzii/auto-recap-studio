name: Generate 3D Kiko Host Assets

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate all 25+ 3D sprites and 4 genre booths even if already 640x640 / 1080x900"
        required: false
        type: boolean
        default: true

jobs:
  generate-kiko-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate 3D Pixar-style Kiko sprites and genre booths
        env:
          FORCE_REGEN: ${{ inputs.force }}
        run: |
          FORCE_FLAG=""
          if [ "$FORCE_REGEN" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/generate_host_assets_ai.py $FORCE_FLAG

      - name: Verify 25+ RGBA sprites (640x640) and 4 booths (1080x900)
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          sprites = sorted(Path("assets/host/sprites").glob("*.png"))
          booths = sorted(Path("assets/host/booths").glob("*.png"))
          preview = Path("assets/host/host_preview_sheet.jpg")

          assert len(sprites) >= 25, f"Expected >=25 sprites, found {len(sprites)}"
          assert len(booths) == 4, f"Expected 4 booths, found {len(booths)}"
          assert preview.exists() and preview.stat().st_size > 10_000, "Missing host_preview_sheet.jpg"

          for sp in sprites:
              with Image.open(sp) as im:
                  assert im.size == (640, 640), f"{sp.name} size {im.size} != (640, 640)"
                  assert im.mode == "RGBA", f"{sp.name} mode {im.mode} != RGBA"
                  alpha = im.getchannel("A")
                  lo, hi = alpha.getextrema()
                  assert lo == 0 and hi > 200, f"{sp.name} alpha extrema {lo}..{hi} looks un-keyed"

          for bp in booths:
              with Image.open(bp) as im:
                  assert im.size == (1080, 900), f"{bp.name} size {im.size} != (1080, 900)"

          print(f"VERIFIED: {len(sprites)} sprites (640x640 RGBA) + {len(booths)} booths (1080x900) + preview sheet OK.")
          PY

      - name: Upload Kiko visual verification contact sheet
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiko-3d-host-preview
          path: assets/host/host_preview_sheet.jpg
          if-no-files-found: warn
          retention-days: 14

      - name: Write workflow summary
        run: |
          SPRITE_CNT=$(find assets/host/sprites -maxdepth 1 -name '*.png' | wc -l)
          BOOTH_CNT=$(find assets/host/booths -maxdepth 1 -name '*.png' | wc -l)
          {
            echo "## 3D Pixar-Style Kiko Host Asset Pack"
            echo ""
            echo "- **Sprites generated (640x640 RGBA):** ${SPRITE_CNT}"
            echo "- **Genre booths generated (1080x900):** ${BOOTH_CNT}"
            echo "- **Preview contact sheet artifact:** \`kiko-3d-host-preview\` (\`assets/host/host_preview_sheet.jpg\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push updated 3D host assets to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/host/sprites/*.png assets/host/booths/*.png assets/host/host_preview_sheet.jpg
          git diff --cached --quiet || (git commit -m "chore(assets): generate 3D Pixar-style Kiko sprite pack and booths [skip ci]" && git pull --rebase origin main && git push)
