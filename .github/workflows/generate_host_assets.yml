name: Generate 3D Kiko 2.0 Host Assets

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate all 31+ Kiko 2.0 sprites and 4 dark cinema booths even if already 640x640 / 1080x700"
        required: false
        type: boolean
        default: true

jobs:
  generate-kiko-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Blender 3D Cycles (fallback if Gemini image quota is 0)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends blender

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate 3D Pixar-style Kiko 2.0 sprites and dark cinema booths
        env:
          FORCE_REGEN: ${{ inputs.force }}
        run: |
          FORCE_FLAG=""
          if [ "$FORCE_REGEN" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/generate_host_assets_ai.py $FORCE_FLAG

      - name: Verify 31+ RGBA sprites (640x640) and 4 dark booths (1080x700)
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          from PIL import Image

          sprites = sorted(Path("assets/host/sprites").glob("*.png"))
          booths = sorted(Path("assets/host/booths").glob("*.png"))
          preview = Path("assets/host/host_preview_sheet.jpg")

          assert len(sprites) >= 31, f"Expected >=31 Kiko 2.0 sprites, found {len(sprites)}"
          assert len(booths) == 4, f"Expected 4 booths, found {len(booths)}"
          assert preview.exists() and preview.stat().st_size > 10_000, "Missing host_preview_sheet.jpg"

          names = {p.name for p in sprites}
          for req in (
              "neutral_closed.png",
              "neutral_blink.png",
              "blink.png",
              "disgusted_closed.png",
              "disgusted_open.png",
              "suspicious_closed.png",
              "suspicious_open.png",
              "hyped_open.png",
              "facepalm_open.png",
          ):
              assert req in names, f"Missing required Kiko 2.0 sprite: {req}"

          for sp in sprites:
              with Image.open(sp) as im:
                  assert im.size == (640, 640), f"{sp.name} size {im.size} != (640, 640)"
                  assert im.mode == "RGBA", f"{sp.name} mode {im.mode} != RGBA"
                  alpha = im.getchannel("A")
                  lo, hi = alpha.getextrema()
                  assert lo == 0 and hi > 200, f"{sp.name} alpha extrema {lo}..{hi} looks un-keyed"

          for bp in booths:
              with Image.open(bp) as im:
                  assert im.size == (1080, 700), f"{bp.name} size {im.size} != (1080, 700)"
                  luma = float(np.array(im.convert("L"), dtype=np.float32).mean())
                  assert luma < 95.0, f"{bp.name} too bright for dark cinema booth (mean luma={luma:.1f} >= 95)"
                  print(f"Booth {bp.name}: {im.size}, mean_luma={luma:.1f}")

          print(f"VERIFIED: {len(sprites)} Kiko 2.0 sprites (640x640 RGBA) + {len(booths)} dark booths (1080x700) + preview sheet OK.")
          PY

      - name: Upload Kiko 2.0 visual verification contact sheet
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kiko-3d-host-preview
          path: assets/host/host_preview_sheet.jpg
          if-no-files-found: warn
          retention-days: 14

      - name: Write workflow summary
        run: |
          SPRITE_CNT=$(find assets/host/sprites -maxdepth 1 -name '*.png' | wc -l)
          BOOTH_CNT=$(find assets/host/booths -maxdepth 1 -name '*.png' | wc -l)
          {
            echo "## 3D Pixar-Style Kiko 2.0 Host Asset Pack"
            echo ""
            echo "- **Sprites generated (640x640 RGBA, 10 poses + blink):** ${SPRITE_CNT}"
            echo "- **Dark compact cinema booths (1080x700):** ${BOOTH_CNT}"
            echo "- **Preview contact sheet artifact:** \`kiko-3d-host-preview\` (\`assets/host/host_preview_sheet.jpg\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push updated 3D host assets to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/host/sprites/*.png assets/host/booths/*.png assets/host/host_preview_sheet.jpg
          git diff --cached --quiet || (git commit -m "chore(assets): generate Kiko 2.0 10-pose sprite pack and dark 1080x700 booths [skip ci]" && git pull --rebase origin main && git push)
