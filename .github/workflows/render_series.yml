name: Render 3-Part Viral Series

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Project slug (e.g. sprite_fright)"
        required: true
        type: string
        default: sprite_fright
      parts:
        description: "Number of chronological 3-Act parts"
        required: true
        type: string
        default: "3"
      force_regenerate:
        description: "Force regenerate 3-Act Director plan and commentary scripts"
        required: false
        type: boolean
        default: true
      publish_target:
        description: "Delivery target"
        required: false
        type: choice
        default: artifact_only
        options:
          - artifact_only
          - telegram
          - youtube_private

jobs:
  render-series:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Reclaim disk space if needed
        run: |
          FREE_GB=$(df -BG /tmp | awk 'NR==2 {gsub("G","",$4); print $4}')
          if [ "$FREE_GB" -lt 15 ]; then
            sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          fi

      - name: Install FFmpeg and font dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core libass9 fontconfig
          ffmpeg -filters | grep -E "(^| )ass( |$)"

      - name: Cache Whisper models, BGM, and fonts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/recap_bgm
            assets/fonts
          key: recap-series-cache-v2

      - name: Install Montserrat ExtraBold font
        run: |
          mkdir -p assets/fonts ~/.local/share/fonts
          if [ ! -s assets/fonts/Montserrat-ExtraBold.ttf ] || [ "$(wc -c < assets/fonts/Montserrat-ExtraBold.ttf)" -lt 20000 ]; then
            curl -fsSL -o assets/fonts/Montserrat-ExtraBold.ttf \
              "https://cdn.jsdelivr.net/fontsource/fonts/montserrat@latest/latin-800-normal.ttf" \
              || curl -fsSL -o assets/fonts/Montserrat-ExtraBold.ttf \
                "https://github.com/JulietaUla/Montserrat/raw/master/fonts/ttf/Montserrat-ExtraBold.ttf" \
              || echo "Montserrat download failed; falling back to DejaVu Sans Bold"
          fi
          if [ -s assets/fonts/Montserrat-ExtraBold.ttf ]; then
            cp assets/fonts/Montserrat-ExtraBold.ttf ~/.local/share/fonts/Montserrat-ExtraBold.ttf
            fc-cache -fv
          fi

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Render 3-Act Series (live Gemini + edge-tts + 3D Kiko)
        env:
          SLUG: ${{ inputs.slug }}
          PARTS: ${{ inputs.parts }}
          FORCE_REGENERATE: ${{ inputs.force_regenerate }}
          PUBLISH_TARGET: ${{ inputs.publish_target }}
        run: |
          FORCE_FLAG="--force"
          if [ "$FORCE_REGENERATE" != "true" ]; then
            FORCE_FLAG="--no-force"
          fi
          python main.py run-series \
            --slug "$SLUG" \
            --parts "$PARTS" \
            --mode chapter_commentary \
            --publish-target "$PUBLISH_TARGET" \
            $FORCE_FLAG

      - name: Assert all rendered parts passed QA Gate
        env:
          SLUG: ${{ inputs.slug }}
          PARTS: ${{ inputs.parts }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          slug = os.environ["SLUG"]
          parts = int(os.environ["PARTS"])
          out_dir = Path("/tmp/recap_work") / slug / "output"
          qa_path = out_dir / "qa_summary.json"
          plan_path = out_dir / "three_act_plan.json"

          assert qa_path.exists(), f"Missing {qa_path}"
          assert plan_path.exists(), f"Missing {plan_path}"
          summary = json.loads(qa_path.read_text(encoding="utf-8"))
          assert summary.get("all_passed") is True, f"QA failed: {summary}"
          assert len(summary.get("parts", [])) == parts, f"Expected {parts} parts in qa_summary.json"

          for k in range(1, parts + 1):
              mp4 = out_dir / f"part{k}_final_short.mp4"
              assert mp4.exists() and mp4.stat().st_size > 500_000, f"Invalid or missing {mp4}"
          print(f"ALL {parts} PARTS PASSED QA GATE FOR {slug}!")
          PY

      - name: Upload 3-part Reels, 3-Act plan & QA summary artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: series-${{ inputs.slug }}-reels
          path: |
            /tmp/recap_work/${{ inputs.slug }}/output/part*_final_short.mp4
            /tmp/recap_work/${{ inputs.slug }}/output/three_act_plan.json
            /tmp/recap_work/${{ inputs.slug }}/output/qa_summary.json
            /tmp/recap_work/${{ inputs.slug }}/output/part*_qa_report.json
            /tmp/recap_work/${{ inputs.slug }}/output/part*_script.json
            projects/${{ inputs.slug }}/part_*_timeline_map.json
          if-no-files-found: warn
          retention-days: 7

      - name: Cleanup work directory
        if: always()
        run: rm -rf /tmp/recap_work
