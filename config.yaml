pipeline:
  default_mode: chapter_commentary

chapter_commentary:
  target_chapter_sec: 82.0
  min_chapter_sec: 65.0
  max_chapter_sec: 120.0
  contact_sheet_interval_sec: 2.0
  storyboard_interval_sec: 5.0
  source_audio_normal_db: -6.0
  source_audio_ducked_db: -18.0
  bgm_fallback_db: -15.0
  min_gap_between_lines_sec: 0.30
  max_line_speedup: 1.14
  audio_crossfade_sec: 0.12
  freeze_zoom_end: 1.10
  min_commentary_share: 0.35
  max_commentary_share: 0.65
  min_distinct_emotions: 5

host:
  enabled: true
  name: "Kiko"
  sprites_dir: "assets/host/sprites"
  booths_dir: "assets/host/booths"
  fps: 30
  booth_width: 1080
  booth_height: 970
  sprite_size: 620
  desk_y_ratio: 0.69
  rms_open_threshold: 0.085
  rms_half_threshold: 0.028
  blink_interval_sec: [2.8, 4.6]
  blink_duration_ms: 120
  character_x_ratio: 0.39
  screen_glow_strength: 0.06
  emotion_crossfade_frames: 4
  max_head_tilt_deg: 2.5

runtime:
  fps: 30
  width: 1080
  height: 1920
  min_duration_sec: 45
  max_duration_sec: 175
  work_dir: /tmp/recap_work
  min_free_disk_gb: 4
  threads: 2
  time_budget_minutes: 55

rights:
  strict_rights_check: true
  allowed_licenses: [public_domain, cc0, cc_by, cc_by_sa, owned, licensed]

source:
  max_source_gb: 6
  exclude_head_sec: 12
  exclude_tail_pct: 8
  auto_detect_end_credits: true
  max_auto_credit_tail_pct: 30
  auto_transcribe_source: true
  whisper_model_fallback: base.en
  subtitle_language: en
  pass1_visual_overview: true
  pass1_max_frames: 48
  pass1_grid_cols: 4
  pass1_grid_rows: 4

llm:
  provider: gemini
  model: gemini-3.5-flash
  fallback_models: ["gemini-3.5-flash-lite", "gemini-3.8-flash", "gemini-2.0-flash"]
  temperature: 0.7
  max_retries: 3
  chunk_tokens: 2500
  chunk_overlap_tokens: 200
  openai_compatible:
    base_url: ""
    model: ""

script:
  style: commentary
  min_words: 170
  max_words: 330
  min_beats: 12
  max_beats: 22
  beat_min_words: 6
  beat_max_words: 20
  min_commentary_share: 0.10
  max_commentary_share: 0.22
  max_commentary_beat_words: 12
  min_story_beats_between_commentary: 2
  split_cliffhanger_range: [0.40, 0.50]

tts:
  backend: edge_tts
  voice: en-US-AndrewMultilingualNeural
  rate: "+10%"
  retries: 4
  backoff_base_sec: 1.5
  trim_silence_db: -45
  internal_pause_max_ms: 130
  internal_pause_target_ms: 70
  beat_loudness_lufs: -16
  beat_gap_frames: 1
  ending_pad_frames: 15
  max_global_atempo: 1.18
  mock_tone_hz: 280

shots:
  min_shot_sec: 1.4
  max_shot_sec: 3.0
  hard_max_shot_sec: 3.5
  target_shot_sec: 2.0
  speed_range: [0.98, 1.10]
  proxy_height: 320
  scene_threshold: 27.0
  min_luma: 15
  min_luma_std: 18.0
  motion_sample_fps: 2
  never_reuse_source_range: true
  candidates_per_beat: 6

vision:
  enabled: true
  provider: gemini
  frames_per_candidate: 3
  contact_sheet_max_px: 1280
  min_match_score: 5
  batch_beats_per_call: 4
  rate_limit_sleep_sec: 4

layout:
  mode: blurred_letterbox
  bg_blur: "boxblur=20:5"
  bg_brightness: -0.04
  bg_saturation: 1.25
  fg_zoom_pct: 3
  min_fg_height_px: 1020
  max_horizontal_crop_pct: 45
  auto_deinterlace: true
  combing_threshold: 1.12
  vintage_deinterlace_year: 1985
  overscan_trim_pct: 3.0
  auto_full_bleed_max_aspect: 1.45
  banner:
    enabled: false
    y: 200
    max_words: 6

grade:
  enabled: true
  eq: "contrast=1.08:saturation=1.22:brightness=0.02"
  unsharp: "5:5:0.7:5:5:0.0"

captions:
  mode: single_word
  model: base.en
  device: cpu
  compute_type: int8
  cpu_threads: 2
  words_per_chunk: [1, 1]
  min_word_display_ms: 110
  max_chars_per_line: 16
  font_name: "Montserrat ExtraBold"
  font_fallback: "DejaVu Sans Bold"
  font_size: 92
  outline_px: 7
  shadow_px: 3
  active_color: "#FFFFFF"
  inactive_color: "#FFFFFF"
  emphasis_color: "#FFD84D"
  alignment: 2
  margin_v: 500
  accent_rotation: ["#FFFFFF"]

audio:
  source_audio_mode: "off"
  source_ducked_db: -26
  bgm_db_below_voice: -15
  bgm_fade_out_sec: 1.2
  sfx_on_transitions: false
  target_lufs: -14
  true_peak_db: -1.0
  sample_rate: 48000
  aac_bitrate: 192k

encode:
  preset: veryfast
  crf: 20
  intermediate_crf: 16
  intermediate_preset: ultrafast
  parallel_shot_jobs: 2

publishing:
  default_target: all_private
  max_public_uploads_per_week: 3
  youtube:
    category_id: "1"
    default_privacy: private
    contains_synthetic_media: true
  telegram:
    max_video_mb: 50
  r2:
    presign_days: 7

qa:
  av_sync_tolerance_sec: 0.15
  max_silence_gap_ms: 400
  min_avg_match_score: 6.0
  min_hook_match_score: 7.0
  require_ending_reach_pct: 0.80
  fail_on_warnings: false

scout:
  default_providers: ["blender_peertube", "wikimedia_commons", "sepiasearch"]
  min_duration_sec: 150
  max_duration_sec: 1500
  min_width_px: 720
  preferred_width_px: 1280
  user_agent: "auto-recap-studio/1.0 (https://github.com/local/auto-recap-studio)"
