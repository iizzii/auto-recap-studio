runtime:
  min_duration_sec: 15
  max_duration_sec: 35
  time_budget_minutes: 20

source:
  exclude_head_sec: 0
  exclude_tail_pct: 0
  auto_detect_end_credits: false
  pass1_visual_overview: false

layout:
  auto_deinterlace: false
  overscan_trim_pct: 0.0
  auto_full_bleed_max_aspect: 0.0
  banner:
    enabled: false

shots:
  min_shot_sec: 1.4
  max_shot_sec: 3.0
  hard_max_shot_sec: 3.5
  target_shot_sec: 2.0
  min_luma_std: 5.0
  never_reuse_source_range: false

audio:
  sfx_on_transitions: false

tts:
  ending_pad_frames: 15

script:
  min_words: 40
  max_words: 90
  min_beats: 4
  max_beats: 8
  beat_min_words: 6
  beat_max_words: 20
